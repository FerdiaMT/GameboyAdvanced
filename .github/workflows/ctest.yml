name: CTest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Debug CTest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install --yes clang iverilog libsdl2-dev
      - run: cmake --preset debug
      - run: cmake --build --preset debug --parallel 2
      - name: Run CTest suite
        shell: bash
        run: |
          set +e
          ctest --preset debug --output-on-failure | tee ctest.log
          status=${PIPESTATUS[0]}
          summary=$(grep -E '[0-9]+% tests passed, [0-9]+ tests failed out of [0-9]+' ctest.log | tail -1 || true)
          printf '## CTest\n\n```text\n%s\n```\n' "${summary:-CTest did not produce a summary.}" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: ctest.log
          if-no-files-found: ignore
          retention-days: 14
