name: Callgrind profile

on:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 0'

permissions:
  contents: read

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - run: |
          sudo apt-get update
          sudo apt-get install --yes clang iverilog valgrind
      - run: |
          cmake --preset debug
          cmake --build --preset debug --target GBA_regression_tests --parallel 2
          mkdir -p callgrind
          valgrind --tool=callgrind --callgrind-out-file=callgrind/callgrind.out build/debug/GBA_regression_tests
          callgrind_annotate --auto=yes callgrind/callgrind.out > callgrind/callgrind.txt
          printf '## Callgrind\n\nA call-count profile is available as an artifact.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: callgrind-profile
          path: callgrind
          retention-days: 30
