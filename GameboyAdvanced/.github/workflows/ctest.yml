name: CTest

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Debug CTest
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang iverilog

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug --parallel 2

      - name: Run CTest suite
        run: ctest --preset debug --output-on-failure
