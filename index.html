<!doctypehtml><html lang=en><head><meta charset=utf-8><meta content="width=device-width,initial-scale=1"name=viewport><title>Super Mario Advance</title><style>:root{color-scheme:dark;font-family:ui-sans-serif,system-ui,sans-serif;background:#1d1d21;color:#eceaec}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:1.5rem;box-sizing:border-box}main{width:min(100%,800px)}header{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 .65rem;color:#b9b6c0;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase}h1{margin:0;color:#f3f1f5;font-size:.95rem;font-weight:650;letter-spacing:.02em;text-transform:none}.screen{padding:.65rem;background:#101014;border:1px solid #3b3941;border-radius:.55rem;box-shadow:0 .7rem 2.5rem #0007}canvas{display:block;width:100%;height:auto;aspect-ratio:3/2;background:#000;image-rendering:pixelated;outline:0}footer{display:flex;align-items:center;gap:.45rem;margin-top:.7rem;min-height:2rem;color:#9b98a2;font-size:.78rem}button{appearance:none;border:1px solid #55515c;border-radius:.3rem;padding:.35rem .6rem;background:0 0;color:#e8e5eb;font:inherit;cursor:pointer}button:focus-visible,button:hover{border-color:#b2a6db;background:#302c3b;outline:0}.keys{margin-left:auto;text-align:right}#status{color:#9b98a2}@media (max-width:560px){body{padding:.75rem}.keys{display:none}}</style></head><body><main><header><h1>Super Mario Advance</h1><span aria-live=polite id=status>Loading…</span></header><div class=screen><canvas aria-label="Game display"height=160 id=screen tabindex=0 width=240></canvas></div><footer><button id=pause type=button>Pause</button> <button id=reset type=button>Reset</button> <span class=keys>Z / X · arrows · Enter / Backspace</span></footer></main><script async src=index.js></script></body></html>
